<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Request Details — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <main class="max-w-5xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div id="request-content-container">
      <div class="text-center py-12">
        <div class="animate-spin text-3xl mb-2">🩸</div>
        <p class="text-slate-500 font-medium">Loading request timeline & matches...</p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/matching.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const reqId = urlParams.get('id') || 1;
      loadRequestDetails(reqId);
    });

    async function loadRequestDetails(reqId) {
      const container = document.getElementById('request-content-container');
      try {
        const reqRes = await api.get(`/blood-requests/${reqId}`);
        const matchesRes = await api.get(`/blood-requests/${reqId}/matches`);

        if (!reqRes || !reqRes.data) {
          container.innerHTML = '<div class="glass-card p-8 text-center text-slate-600">Request not found</div>';
          return;
        }

        const req = reqRes.data;
        const matches = matchesRes && matchesRes.data ? matchesRes.data.matches : [];

        // Build Timeline Visualizer
        const timelineSteps = [
          { key: 'pending', label: 'Request Created' },
          { key: 'searching', label: 'Searching Donors' },
          { key: 'donor_notified', label: 'Donors Notified' },
          { key: 'donor_accepted', label: 'Donor Accepted' },
          { key: 'completed', label: 'Completed' }
        ];

        let html = `
          <!-- Header -->
          <div class="glass-card p-6 mb-8 flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="badge ${req.priority === 'critical' ? 'badge-critical' : 'badge-urgent'} text-xs font-bold uppercase mb-2">Priority: ${req.priority}</span>
              <h1 class="text-3xl font-extrabold text-slate-900">Request #${req.id} — ${req.units_required} Unit(s) of ${req.blood_group}</h1>
              <p class="text-sm text-slate-600 mt-1">Hospital: <b>${req.hospital_name}</b> • Requester: <b>${req.requester_name}</b></p>
            </div>
            <div class="flex items-center gap-3">
              ${req.status !== 'completed' && req.status !== 'cancelled' ? `
                <button onclick="cancelRequest(${req.id})" class="btn-outline text-red-600 border-red-200 hover:bg-red-50 text-sm">
                  Cancel Request
                </button>
              ` : ''}
              <a href="request-history.html" class="btn-blue text-sm">View History</a>
            </div>
          </div>

          <!-- Timeline -->
          <div class="glass-card p-8 mb-8">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-6">Live Status Timeline</h3>
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 relative">
              ${timelineSteps.map((step, idx) => {
                const isPassed = timelineSteps.findIndex(s => s.key === req.status) >= idx || req.status === 'completed';
                return `
                  <div class="flex flex-col items-center z-10 text-center">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${isPassed ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-200 text-slate-500'}">
                      ${isPassed ? '✓' : (idx + 1)}
                    </div>
                    <span class="text-xs font-bold mt-2 ${isPassed ? 'text-slate-900' : 'text-slate-400'}">${step.label}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Matched Donors Section -->
          <h2 class="text-xl font-bold text-slate-900 mb-4">Ranked Candidate Donors (${matches.length})</h2>
          <div class="space-y-4">
            ${matches.length === 0 ? '<div class="glass-card p-6 text-center text-slate-500">No donor matches recorded for this request yet.</div>' : matches.map(m => renderMatchCard(m)).join('')}
          </div>
        `;

        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-xl">Error loading request details: ${e.message}</div>`;
      }
    }

    async function cancelRequest(id) {
      if (!confirm('Are you sure you want to cancel this emergency blood request?')) return;
      try {
        const res = await api.post(`/blood-requests/${id}/cancel`);
        if (res && res.success) {
          showToast('Request cancelled successfully', 'success');
          loadRequestDetails(id);
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
