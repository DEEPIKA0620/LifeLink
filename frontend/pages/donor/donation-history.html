<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation History — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="px-3 py-2 text-xs font-bold text-slate-400 uppercase">Donor Navigation</div>
      <a href="pages/donor/dashboard.html" class="sidebar-link">🩸 Dashboard</a>
      <a href="pages/donor/profile.html" class="sidebar-link">👤 My Profile</a>
      <a href="pages/donor/donation-history.html" class="sidebar-link active">📜 Donation History</a>
      <a href="pages/notifications.html" class="sidebar-link">🔔 Notifications</a>
    </aside>

    <main class="dashboard-main">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-6">Your Life-Saving Donation History</h1>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Donation Date</th>
              <th>Blood Group</th>
              <th>Units</th>
              <th>Hospital / Center</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="history-rows">
            <tr><td colspan="6" class="text-center py-8 text-slate-500">Loading history...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      requireRole(['donor', 'admin']);
      const tbody = document.getElementById('history-rows');

      try {
        const res = await api.get('/donors/history');
        if (!res || !res.data || !res.data.history || res.data.history.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-500">No past donation records found.</td></tr>';
          return;
        }

        tbody.innerHTML = res.data.history.map(h => `
          <tr>
            <td class="font-extrabold">#${h.id}</td>
            <td>${formatDate(h.donation_date)}</td>
            <td><span class="badge bg-red-100 text-red-700 font-extrabold">${h.blood_group}</span></td>
            <td class="font-bold">${h.units} Unit(s)</td>
            <td class="font-semibold text-slate-900">${h.hospital_name}</td>
            <td>${h.notes || 'Emergency donation'}</td>
          </tr>
        `).join('');

      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-red-600">Error loading history: ${e.message}</td></tr>`;
      }
    });
  </script>
</body>
</html>
