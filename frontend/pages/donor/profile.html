<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Profile — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="px-3 py-2 text-xs font-bold text-slate-400 uppercase">Donor Navigation</div>
      <a href="pages/donor/dashboard.html" class="sidebar-link">🩸 Dashboard</a>
      <a href="pages/donor/profile.html" class="sidebar-link active">👤 My Profile</a>
      <a href="pages/donor/donation-history.html" class="sidebar-link">📜 Donation History</a>
      <a href="pages/notifications.html" class="sidebar-link">🔔 Notifications</a>
    </aside>

    <main class="dashboard-main">
      <div class="max-w-2xl mx-auto glass-card p-8">
        <h1 class="text-2xl font-extrabold text-slate-900 mb-6">Donor Profile Settings</h1>

        <form id="donor-profile-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Blood Group</label>
            <select id="prof-blood-group" class="w-full p-3 border border-slate-300 rounded-lg font-bold text-red-600">
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Availability Status</label>
            <select id="prof-availability" class="w-full p-3 border border-slate-300 rounded-lg font-bold">
              <option value="available">Available to Donate</option>
              <option value="unavailable">Currently Unavailable</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Last Blood Donation Date</label>
            <input type="date" id="prof-last-donation" class="w-full p-3 border border-slate-300 rounded-lg">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">City</label>
            <input type="text" id="prof-city" value="Bengaluru" class="w-full p-3 border border-slate-300 rounded-lg">
          </div>

          <button type="submit" class="w-full btn-blue py-3 font-bold text-base mt-2">
            Save Profile Updates
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireRole(['donor', 'admin']);
      
      document.getElementById('donor-profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          blood_group: document.getElementById('prof-blood-group').value,
          availability_status: document.getElementById('prof-availability').value,
          last_donation_date: document.getElementById('prof-last-donation').value || null,
          city: document.getElementById('prof-city').value
        };

        try {
          const res = await api.put('/donors/profile', payload);
          if (res && res.success) {
            showToast('Profile saved successfully!', 'success');
          }
        } catch (err) {}
      });
    });
  </script>
</body>
</html>
