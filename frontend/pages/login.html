<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <main class="max-w-md mx-auto py-16 px-4">
    <div class="glass-card p-8">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-red-600 text-white font-extrabold text-2xl flex items-center justify-center mx-auto mb-3">✚</div>
        <h1 class="text-2xl font-extrabold text-slate-900">Account Login</h1>
        <p class="text-xs text-slate-500 mt-1">Access your LifeLink portal</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email Address</label>
          <input type="email" id="login-email" required placeholder="user@example.com" class="w-full p-3 border border-slate-300 rounded-lg text-slate-900 focus:ring-2 focus:ring-sky-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-3 border border-slate-300 rounded-lg text-slate-900 focus:ring-2 focus:ring-sky-500 outline-none">
        </div>

        <button type="submit" class="w-full btn-blue py-3.5 font-bold text-base shadow-md">
          Sign In
        </button>
      </form>

      <!-- Quick Demo Account Preset Buttons -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <p class="text-xs font-bold text-slate-400 uppercase text-center mb-3">Quick Demo Logins</p>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button onclick="fillDemo('patient1@example.com')" class="p-2 bg-slate-100 hover:bg-slate-200 rounded font-semibold text-slate-700">Patient Demo</button>
          <button onclick="fillDemo('ravi.kumar@example.com')" class="p-2 bg-red-50 hover:bg-red-100 rounded font-semibold text-red-700">Donor Demo</button>
          <button onclick="fillDemo('manipal@lifelink.org')" class="p-2 bg-blue-50 hover:bg-blue-100 rounded font-semibold text-blue-700">Hospital Demo</button>
          <button onclick="fillDemo('apollopharm1@lifelink.org')" class="p-2 bg-emerald-50 hover:bg-emerald-100 rounded font-semibold text-emerald-700">Pharmacy Demo</button>
          <button onclick="fillDemo('admin@lifelink.org')" class="col-span-2 p-2 bg-slate-800 hover:bg-slate-900 text-white rounded font-semibold">Admin Portal Demo</button>
        </div>
      </div>

      <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account? <a href="pages/register.html" class="font-bold text-sky-600 hover:underline">Register here</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>

  <script>
    function fillDemo(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'Password123!';
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      loginUser(email, pass);
    });
  </script>
</body>
</html>
