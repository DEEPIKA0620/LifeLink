<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <main class="max-w-4xl mx-auto py-10 px-4">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900">Notifications</h1>
        <p class="text-sm text-slate-600 mt-1">Emergency requests, donor responses, and system alerts.</p>
      </div>
      <button onclick="markAllRead()" class="btn-outline text-sm">
        ✓ Mark All as Read
      </button>
    </div>

    <div class="space-y-4" id="notifications-list">
      <div class="text-center py-12 text-slate-500">Loading notifications...</div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      loadNotificationsList();
    });

    async function loadNotificationsList() {
      const container = document.getElementById('notifications-list');
      try {
        const res = await api.get('/notifications');
        if (!res || !res.data || !res.data.notifications || res.data.notifications.length === 0) {
          container.innerHTML = '<div class="glass-card p-12 text-center text-slate-500">No notifications found.</div>';
          return;
        }

        const notifications = res.data.notifications;
        container.innerHTML = notifications.map(n => `
          <div class="glass-card p-6 border-l-4 ${n.type === 'emergency_request' ? 'border-l-red-600 bg-red-50/20' : (n.type === 'donor_accepted' ? 'border-l-emerald-600 bg-emerald-50/20' : 'border-l-sky-600')} ${n.is_read ? 'opacity-75' : ''}">
            <div class="flex items-start justify-between">
              <div>
                <span class="badge ${n.type === 'emergency_request' ? 'badge-critical' : 'badge-normal'} text-xs font-bold uppercase">${n.type.replace('_', ' ')}</span>
                <h3 class="text-lg font-bold text-slate-900 mt-1">${n.title}</h3>
                <p class="text-sm text-slate-700 mt-1">${n.message}</p>
                <span class="block text-xs text-slate-400 mt-2">${formatDate(n.created_at)}</span>
              </div>
              ${!n.is_read ? `
                <button onclick="markRead(${n.id})" class="text-xs text-sky-600 font-bold hover:underline">
                  Mark Read
                </button>
              ` : '<span class="text-xs text-slate-400 font-medium">Read</span>'}
            </div>
          </div>
        `).join('');

      } catch (e) {
        container.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-xl">Error: ${e.message}</div>`;
      }
    }

    async function markRead(id) {
      try {
        await api.put(`/notifications/${id}/read`);
        loadNotificationsList();
        updateUnreadBadge();
      } catch (e) {}
    }

    async function markAllRead() {
      try {
        await api.put('/notifications/read-all');
        showToast('All notifications marked as read', 'success');
        loadNotificationsList();
        updateUnreadBadge();
      } catch (e) {}
    }
  </script>
</body>
</html>
