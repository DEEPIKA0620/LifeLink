<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request History — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-slate-900">Emergency Blood Requests History</h1>
        <p class="text-sm text-slate-600 mt-1">Review active, completed, and archived emergency blood requests.</p>
      </div>
      <a href="emergency-request.html" class="btn-emergency text-sm">
        <span>🚨</span> Create New Request
      </a>
    </div>

    <!-- Filters -->
    <div class="glass-card p-4 mb-6 flex flex-wrap items-center gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase">Filter Status</label>
        <select id="filter-status" onchange="loadHistory()" class="p-2 border border-slate-300 rounded-lg text-sm font-semibold">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="searching">Searching</option>
          <option value="donor_notified">Donor Notified</option>
          <option value="donor_accepted">Donor Accepted</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase">Blood Group</label>
        <select id="filter-bg" onchange="loadHistory()" class="p-2 border border-slate-300 rounded-lg text-sm font-semibold">
          <option value="">All Blood Groups</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
      </div>
    </div>

    <!-- Table Container -->
    <div class="table-responsive">
      <table class="custom-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Blood Group</th>
            <th>Units</th>
            <th>Priority</th>
            <th>Hospital</th>
            <th>Required By</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="8" class="text-center py-8 text-slate-500">Loading requests...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadHistory();
    });

    async function loadHistory() {
      const tbody = document.getElementById('history-tbody');
      const status = document.getElementById('filter-status').value;
      const bg = document.getElementById('filter-bg').value;

      try {
        let url = '/blood-requests?';
        if (status) url += `status=${status}&`;
        if (bg) url += `blood_group=${encodeURIComponent(bg)}`;

        const res = await api.get(url);
        if (!res || !res.data || !res.data.requests) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-500">No requests found.</td></tr>';
          return;
        }

        const requests = res.data.requests;
        if (requests.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-500">No requests matching filters.</td></tr>';
          return;
        }

        tbody.innerHTML = requests.map(r => `
          <tr>
            <td class="font-extrabold">#${r.id}</td>
            <td><span class="badge bg-red-100 text-red-700 font-extrabold">${r.blood_group}</span></td>
            <td class="font-bold">${r.units_required} Unit(s)</td>
            <td><span class="badge ${r.priority === 'critical' ? 'badge-critical' : 'badge-urgent'}">${r.priority}</span></td>
            <td class="font-semibold text-slate-900">${r.hospital_name}</td>
            <td>${formatDate(r.required_by)}</td>
            <td><span class="badge badge-${r.status}">${r.status.replace('_', ' ')}</span></td>
            <td>
              <a href="request-details.html?id=${r.id}" class="text-sky-600 hover:underline font-bold text-sm">
                View Details →
              </a>
            </td>
          </tr>
        `).join('');
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-red-600">Error loading history: ${e.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
