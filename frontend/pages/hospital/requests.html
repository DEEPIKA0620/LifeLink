<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Requests — LifeLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <nav id="main-nav" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm"></nav>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="px-3 py-2 text-xs font-bold text-slate-400 uppercase">Hospital Portal</div>
      <a href="pages/hospital/dashboard.html" class="sidebar-link">🏥 Dashboard</a>
      <a href="pages/hospital/blood-stock.html" class="sidebar-link">🩸 Blood Stock Manager</a>
      <a href="pages/hospital/requests.html" class="sidebar-link active">🚨 Emergency Requests</a>
      <a href="pages/notifications.html" class="sidebar-link">🔔 Notifications</a>
    </aside>

    <main class="dashboard-main">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900">Hospital Emergency Requests</h1>
          <p class="text-sm text-slate-600 mt-1">Track active blood requests assigned to hospital wards.</p>
        </div>
        <a href="pages/emergency-request.html" class="btn-emergency text-sm">
          <span>🚨</span> New Emergency Request
        </a>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Blood Group</th>
              <th>Units</th>
              <th>Priority</th>
              <th>Required By</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="hosp-requests-rows">
            <tr><td colspan="7" class="text-center py-8 text-slate-500">Loading requests...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/utils.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      requireRole(['hospital', 'admin']);
      const tbody = document.getElementById('hosp-requests-rows');

      try {
        const res = await api.get('/blood-requests');
        if (!res || !res.data || !res.data.requests || res.data.requests.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-slate-500">No requests recorded.</td></tr>';
          return;
        }

        tbody.innerHTML = res.data.requests.map(r => `
          <tr>
            <td class="font-extrabold">#${r.id}</td>
            <td><span class="badge bg-red-100 text-red-700 font-extrabold">${r.blood_group}</span></td>
            <td class="font-bold">${r.units_required} Unit(s)</td>
            <td><span class="badge ${r.priority === 'critical' ? 'badge-critical' : 'badge-urgent'}">${r.priority}</span></td>
            <td>${formatDate(r.required_by)}</td>
            <td><span class="badge badge-${r.status}">${r.status.replace('_', ' ')}</span></td>
            <td>
              <a href="pages/request-details.html?id=${r.id}" class="text-sky-600 font-bold hover:underline text-sm">
                View Matches →
              </a>
            </td>
          </tr>
        `).join('');

      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-600">Error loading requests: ${e.message}</td></tr>`;
      }
    });
  </script>
</body>
</html>
